<!DOCTYPE html><html lang='fr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Checkout | FOOTKICKS</title><link rel='stylesheet' href='styles.css'></head><body>
<header><div class='container nav-wrap'><a class='logo' href='index.html'>FOOT<span>KICKS</span></a><a class='icon-btn' href='panier.html'>🛒 <span data-cart-count class='counter'>0</span></a></div></header>
<main class='container'><section><h1 class='section-title'>Checkout 4 étapes</h1><div class='stepper'><div class='step active'>1. Infos client</div><div class='step active'>2. Livraison</div><div class='step active'>3. Paiement</div><div class='step active'>4. Récapitulatif</div></div><div class='checkout-layout'><form class='card' data-checkout-form><div class='form-grid'><label class='field'><span>Prénom</span><input required></label><label class='field'><span>Nom</span><input required></label><label class='field full'><span>Email</span><input type='email' required></label><label class='field full'><span>Adresse</span><input required></label><label class='field'><span>Ville</span><input required></label><label class='field'><span>Code postal</span><input required></label><label class='field'><span>Méthode livraison</span><select><option>Express 24/48h</option><option>Point relais</option></select></label><label class='field'><span>Paiement</span><select><option>Carte bancaire</option><option>Apple Pay</option><option>PayPal</option></select></label></div><button class='btn primary' style='margin-top:1rem;'>Confirmer ma commande</button></form><aside class='card'><h3>Récapitulatif</h3><div class='line'><span>Sous-total</span><strong data-subtotal></strong></div><div class='line'><span>Livraison</span><strong data-shipping></strong></div><div class='line'><span>Total</span><strong data-total></strong></div><p class='muted'>Aucun compte requis. Checkout en moins de 90 secondes.</p></aside></div></section></main>
<footer><div class='container'>Protection anti-fraude 3D Secure</div></footer><script src='app.js'></script></body></html>
